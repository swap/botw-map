name: aur

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: package version without v
        required: true
        default: "0.1.1"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: need aur key
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "Add repo secret AUR_SSH_PRIVATE_KEY to publish to AUR."
            exit 1
          fi

      - name: setup ssh
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n' > ~/.ssh/config

      - name: version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ver=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: push botw-map
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          rm -rf /tmp/aur-pkg
          git clone ssh://aur@aur.archlinux.org/botw-map.git /tmp/aur-pkg
          cp aur/botw-map/PKGBUILD /tmp/aur-pkg/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VER}/" /tmp/aur-pkg/PKGBUILD
          DEB_URL="https://github.com/swap/botw-map/releases/download/v${VER}/BOTW.Map_${VER}_amd64.deb"
          curl -fsSL -o /tmp/pkg.deb "$DEB_URL"
          SUM=$(sha256sum /tmp/pkg.deb | awk '{print $1}')
          sed -i "s/^sha256sums=.*/sha256sums=('${SUM}')/" /tmp/aur-pkg/PKGBUILD
          cd /tmp/aur-pkg
          makepkg --printsrcinfo > .SRCINFO
          git config user.name "swap"
          git config user.email "swap@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "meoww" || exit 0
          git push origin master
